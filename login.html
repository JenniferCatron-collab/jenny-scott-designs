<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Jenny Scott Designs</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body { padding: 28px; font-family: Arial, Helvetica, sans-serif; text-align: center; }
    form { max-width: 360px; margin: 36px auto; }
    input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { padding: 10px 14px; border-radius: 6px; background: #000; color: #fff; border: none; width: 100%; cursor: pointer; margin-top: 8px; }
    button:hover { background: #333; }
    .error { color: red; margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <nav class="mobile-nav" id="mobileNav">
    <button class="close-btn" id="menuClose">×</button>
    <a href="index.html">Home</a>
    <a href="page1.html">Flower Arrangements</a>
    <a href="page2.html">Sympathy Arrangements</a>
    <a href="page3.html">Weddings &amp; Events</a>
    <a href="gallery.html">Gallery</a>
    <a href="videos.html">Videos</a>
    <a href="diy.html">DIY Video's</a>
  </nav>
  <h2>Sign in to upload</h2>
  <div id="message"></div>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p><a href="/">Return to site</a></p>
  <script>
    var params = new URLSearchParams(window.location.search);
    if(params.get('failed') === '1'){
      document.getElementById('message').innerHTML = '<p class="error">Invalid password. Please try again.</p>';
    }
  </script>
</body>
</html>
